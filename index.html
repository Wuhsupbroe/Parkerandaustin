<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parker & Austin Welcome Game</title>
  <style>
    :root {
      --bg: #0a0a12;
      --panel: #151528;
      --panel-2: #1d1d36;
      --text: #f6f8ff;
      --muted: #9fa7c7;
      --accent-a: #52b6ff;
      --accent-b: #ff66c4;
      --good: #69ff9d;
      --warn: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 10%, #172044 0%, var(--bg) 45%),
                  radial-gradient(circle at 80% 90%, #36153d 0%, var(--bg) 50%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(960px, 100%);
      display: grid;
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid #2b2f53;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.7rem);
      letter-spacing: 0.03em;
    }

    .title-glow {
      background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #3b3f67;
      background: #111428;
      color: var(--text);
      padding: 10px 12px;
    }

    input, select {
      width: 100%;
    }

    button {
      cursor: pointer;
      background: linear-gradient(90deg, #2f4cff, #854dff);
      border: none;
      font-weight: 700;
      transition: transform 0.08s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    button.alt {
      background: linear-gradient(90deg, #3a3f68, #2a2e50);
    }

    .status {
      color: var(--warn);
      font-size: 0.92rem;
      min-height: 1.4rem;
      margin-top: 6px;
    }

    .game {
      display: none;
      gap: 14px;
    }

    .game.live {
      display: grid;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .player {
      background: #111428;
      border: 1px solid #2e3257;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .player h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
    }

    .score {
      margin-top: 4px;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-weight: 800;
    }

    .track {
      height: 12px;
      border-radius: 999px;
      background: #0a0d1f;
      border: 1px solid #2b3156;
      overflow: hidden;
      margin-top: 10px;
    }

    .fill {
      height: 100%;
      width: 0%;
      transition: width 0.12s linear;
    }

    .fill.parker { background: linear-gradient(90deg, #2393ff, #68c1ff); }
    .fill.austin { background: linear-gradient(90deg, #ff4fb8, #ff95d6); }

    .actions {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    .big {
      padding: 14px;
      font-size: 1.05rem;
    }

    .winner {
      font-size: 1.1rem;
      color: var(--good);
      min-height: 1.5rem;
      font-weight: 700;
      text-align: center;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Welcome <span class="title-glow">Parker & Austin</span> 👋</h1>
      <p class="sub">
        Start a room on one device, join from another, then race by tapping as fast as you can.
        First to <strong>20 taps</strong> wins.
      </p>
    </section>

    <section class="card grid">
      <div>
        <label for="playerSelect">I am</label>
        <select id="playerSelect">
          <option value="Parker">Parker</option>
          <option value="Austin">Austin</option>
        </select>
      </div>
      <div>
        <label for="roomInput">Room code (for joining)</label>
        <input id="roomInput" placeholder="e.g. parker-austin-42" autocomplete="off" />
      </div>
      <div class="row" style="align-items: end;">
        <button id="hostBtn">Host New Room</button>
        <button id="joinBtn" class="alt">Join Room</button>
      </div>
      <div>
        <div class="hint">Share this with the other person:</div>
        <div id="shareLink" class="mono hint">(host a room to generate link)</div>
      </div>
      <div>
        <div class="hint">Room code:</div>
        <div id="roomCode" class="mono">-</div>
      </div>
    </section>

    <section class="card">
      <div id="status" class="status">Not connected yet.</div>

      <div id="game" class="game">
        <div class="scoreboard">
          <div class="player">
            <h3>Parker</h3>
            <div id="scoreParker" class="score">0</div>
            <div class="track"><div id="fillParker" class="fill parker"></div></div>
          </div>
          <div class="player">
            <h3>Austin</h3>
            <div id="scoreAustin" class="score">0</div>
            <div class="track"><div id="fillAustin" class="fill austin"></div></div>
          </div>
        </div>

        <div class="winner" id="winnerText"></div>

        <div class="actions">
          <button id="tapBtn" class="big">Tap!</button>
          <button id="restartBtn" class="big alt">Restart Race</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const target = 20;

    const playerSelect = document.getElementById('playerSelect');
    const roomInput = document.getElementById('roomInput');
    const hostBtn = document.getElementById('hostBtn');
    const joinBtn = document.getElementById('joinBtn');
    const statusEl = document.getElementById('status');
    const shareLinkEl = document.getElementById('shareLink');
    const roomCodeEl = document.getElementById('roomCode');
    const gameEl = document.getElementById('game');
    const tapBtn = document.getElementById('tapBtn');
    const restartBtn = document.getElementById('restartBtn');
    const winnerText = document.getElementById('winnerText');

    const scoreParkerEl = document.getElementById('scoreParker');
    const scoreAustinEl = document.getElementById('scoreAustin');
    const fillParkerEl = document.getElementById('fillParker');
    const fillAustinEl = document.getElementById('fillAustin');

    let peer = null;
    let conn = null;
    let isHost = false;
    let myName = 'Parker';
    let roomCode = '';
    let gameState = { Parker: 0, Austin: 0, winner: null };

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? '#ff8a8a' : '#ffd166';
    }

    function codeFromInput() {
      return roomInput.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40);
    }

    function randomCode() {
      return 'pa-' + Math.random().toString(36).slice(2, 8);
    }

    function setRoomUi(code) {
      roomCode = code;
      roomCodeEl.textContent = code;
      const link = `${location.origin}${location.pathname}?room=${encodeURIComponent(code)}`;
      shareLinkEl.textContent = link;
    }

    function render() {
      scoreParkerEl.textContent = String(gameState.Parker);
      scoreAustinEl.textContent = String(gameState.Austin);
      fillParkerEl.style.width = `${Math.min(100, (gameState.Parker / target) * 100)}%`;
      fillAustinEl.style.width = `${Math.min(100, (gameState.Austin / target) * 100)}%`;

      if (gameState.winner) {
        winnerText.textContent = `🏆 ${gameState.winner} wins!`;
        tapBtn.disabled = true;
      } else {
        winnerText.textContent = '';
        tapBtn.disabled = !conn || !conn.open;
      }
    }

    function send(payload) {
      if (conn && conn.open) {
        conn.send(payload);
      }
    }

    function broadcastState() {
      send({ type: 'state', state: gameState });
    }

    function resetGame() {
      gameState = { Parker: 0, Austin: 0, winner: null };
      render();
      if (isHost) {
        broadcastState();
      }
    }

    function applyTap(playerName) {
      if (gameState.winner) return;
      gameState[playerName] += 1;
      if (gameState[playerName] >= target) {
        gameState.winner = playerName;
      }
      render();
    }

    function onData(data) {
      if (!data || typeof data !== 'object') return;

      if (data.type === 'state' && data.state) {
        gameState = data.state;
        render();
        return;
      }

      if (!isHost) return;

      if (data.type === 'tap' && (data.player === 'Parker' || data.player === 'Austin')) {
        applyTap(data.player);
        broadcastState();
      }

      if (data.type === 'restart') {
        resetGame();
      }
    }

    function attachConnection(c) {
      conn = c;

      c.on('open', () => {
        gameEl.classList.add('live');
        tapBtn.disabled = false;
        setStatus('Connected. Tap race is live!');

        if (isHost) {
          broadcastState();
        } else {
          send({ type: 'hello', player: myName });
        }
      });

      c.on('data', onData);

      c.on('close', () => {
        setStatus('Connection closed. Re-host or re-join to play again.', true);
        tapBtn.disabled = true;
      });

      c.on('error', () => {
        setStatus('Connection error. Try a new room code.', true);
      });
    }

    function destroyPeer() {
      if (conn) {
        try { conn.close(); } catch (_) {}
      }
      if (peer) {
        try { peer.destroy(); } catch (_) {}
      }
      conn = null;
      peer = null;
      gameEl.classList.remove('live');
    }

    function startHost() {
      destroyPeer();
      isHost = true;
      myName = playerSelect.value;
      const code = codeFromInput() || randomCode();
      setRoomUi(code);
      setStatus('Starting host...');

      peer = new Peer(code);

      peer.on('open', () => {
        setStatus('Room hosted. Waiting for the other player to join...');
      });

      peer.on('connection', (incoming) => {
        if (conn && conn.open) {
          incoming.close();
          return;
        }
        attachConnection(incoming);
      });

      peer.on('error', () => {
        setStatus('Could not host this room code. Try another code.', true);
      });

      resetGame();
    }

    function startJoin() {
      destroyPeer();
      isHost = false;
      myName = playerSelect.value;
      const code = codeFromInput();

      if (!code) {
        setStatus('Enter a room code to join.', true);
        return;
      }

      setRoomUi(code);
      setStatus('Joining room...');

      peer = new Peer();

      peer.on('open', () => {
        const outgoing = peer.connect(code, { reliable: true });
        attachConnection(outgoing);
      });

      peer.on('error', () => {
        setStatus('Could not join room. Check code or host status.', true);
      });

      resetGame();
    }

    tapBtn.addEventListener('click', () => {
      if (!conn || !conn.open || gameState.winner) return;

      if (isHost) {
        applyTap(myName);
        broadcastState();
      } else {
        send({ type: 'tap', player: myName });
      }
    });

    restartBtn.addEventListener('click', () => {
      if (!conn || !conn.open) return;
      if (isHost) {
        resetGame();
      } else {
        send({ type: 'restart' });
      }
    });

    hostBtn.addEventListener('click', startHost);
    joinBtn.addEventListener('click', startJoin);

    const params = new URLSearchParams(location.search);
    const roomFromUrl = params.get('room');
    if (roomFromUrl) {
      roomInput.value = roomFromUrl;
      setRoomUi(roomFromUrl);
      setStatus('Room detected in URL. Pick your name and press Join Room.');
    }

    render();
  </script>
</body>
</html>
